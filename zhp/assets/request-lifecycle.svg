<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1062" viewBox="0 0 1680 1062"><rect x="0" y="0" width="1680" height="100%" fill="#0B0E14"/><text x="40" y="46" fill="#EEF3FF" font-family="PingFang SC,Helvetica Neue,sans-serif" font-size="25" font-weight="700">一次提问到回复的完整链路</text><text x="40" y="70" fill="#93A5C4" font-family="SF Mono,Menlo,monospace" font-size="11.5">packages/core/agent-loop/src/agent.ts · turn / step 双层循环</text><text x="40" y="124" fill="#4D6BFE" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">客户端</text><text x="40" y="140" fill="#7C8CA8" font-family="PingFang SC,sans-serif" font-size="10.5">Chrome</text><rect x="202" y="94" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="94" width="4" height="76" rx="2" fill="#4D6BFE" opacity="0.9"/><text x="224" y="124" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">① 用户输入</text><text x="224" y="147" fill="#4D6BFE" font-family="SF Mono,Menlo,monospace" font-size="11">apps/web → gateway</text><text x="502" y="147" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">你在 GUI 里发送；走 WebSocket 帧，不是 HTTP 表单</text><path d="M 224 170 L 224 182" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 176 L 224 183 L 228 176" fill="none" stroke="#2A3446" stroke-width="1.5"/><text x="40" y="216" fill="#2FBBA0" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">宿主进程</text><text x="40" y="232" fill="#7C8CA8" font-family="PingFang SC,sans-serif" font-size="10.5">Node</text><rect x="202" y="186" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="186" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="216" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">② 入队并唤醒</text><text x="224" y="239" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:170 send()</text><text x="502" y="239" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">inbox.splice() 写入待处理队列，wakeDriver() 拉起 run()</text><path d="M 224 262 L 224 274" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 268 L 224 275 L 228 268" fill="none" stroke="#2A3446" stroke-width="1.5"/><rect x="202" y="278" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="278" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="308" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">③ 开一轮</text><text x="224" y="331" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:336 turn()</text><text x="502" y="331" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">session.append('turn/start')；一轮 = 若干 step</text><path d="M 224 354 L 224 366" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 360 L 224 367 L 228 360" fill="none" stroke="#2A3446" stroke-width="1.5"/><rect x="202" y="370" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="370" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="400" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">④ 组装上下文</text><text x="224" y="423" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:283 preStep()</text><text x="502" y="423" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">tools.resolve() + systemPrompt.assemble() + runtimeContext.project()</text><path d="M 224 446 L 224 458" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 452 L 224 459 L 228 452" fill="none" stroke="#2A3446" stroke-width="1.5"/><rect x="202" y="462" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="462" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="492" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">⑤ 发请求</text><text x="224" y="515" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:435 prepareRequest()</text><text x="502" y="515" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">renderPrompt → request/header 落盘 → llm.stream(request)</text><path d="M 224 538 L 224 550" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 544 L 224 551 L 228 544" fill="none" stroke="#2A3446" stroke-width="1.5"/><text x="40" y="584" fill="#E0A34E" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">远端</text><text x="40" y="600" fill="#7C8CA8" font-family="PingFang SC,sans-serif" font-size="10.5">DeepSeek</text><rect x="202" y="554" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="554" width="4" height="76" rx="2" fill="#E0A34E" opacity="0.9"/><text x="224" y="584" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">⑥ 模型生成</text><text x="224" y="607" fill="#E0A34E" font-family="SF Mono,Menlo,monospace" font-size="11">llm/llm-deepseek</text><text x="502" y="607" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">流式吐 chunk；这一步我无法自省，只拿到输出</text><path d="M 224 630 L 224 642" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 636 L 224 643 L 228 636" fill="none" stroke="#2A3446" stroke-width="1.5"/><text x="40" y="676" fill="#2FBBA0" font-family="PingFang SC,sans-serif" font-size="12" font-weight="600">宿主进程</text><text x="40" y="692" fill="#7C8CA8" font-family="PingFang SC,sans-serif" font-size="10.5">Node</text><rect x="202" y="646" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="646" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="676" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">⑦ 落盘并推送</text><text x="224" y="699" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:505 live.push()</text><text x="502" y="699" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">assistant/message 写入会话日志，同时增量推给前端</text><path d="M 224 722 L 224 734" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 728 L 224 735 L 228 728" fill="none" stroke="#2A3446" stroke-width="1.5"/><rect x="202" y="738" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="738" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="768" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">⑧ 执行工具</text><text x="224" y="791" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">tool-executor-native</text><text x="502" y="791" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">tool_use → 工具实现 → 沙箱包装 → tool/result 回填</text><path d="M 224 814 L 224 826" stroke="#2A3446" stroke-width="1.5"/><path d="M 220 820 L 224 827 L 228 820" fill="none" stroke="#2A3446" stroke-width="1.5"/><rect x="202" y="830" width="1308" height="76" rx="10" fill="#121722" stroke="#2A3446" stroke-width="1"/><rect x="202" y="830" width="4" height="76" rx="2" fill="#2FBBA0" opacity="0.9"/><text x="224" y="860" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="16" font-weight="600">⑨ 收轮与渲染</text><text x="224" y="883" fill="#2FBBA0" font-family="SF Mono,Menlo,monospace" font-size="11">agent.ts:388/422</text><text x="502" y="883" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="11.5">无工具调用 → step/end → turn/end；前端 Markdown 渲染</text><path d="M 1510 776.0 L 1536 776.0 L 1536 408.0 L 1510 408.0" fill="none" stroke="#4D6BFE" stroke-width="1.6" stroke-dasharray="6 5" opacity="0.85"/><path d="M 1518 403.0 L 1511 408.0 L 1518 413.0" fill="none" stroke="#4D6BFE" stroke-width="1.6" opacity="0.85"/><text x="1544" y="586.0" fill="#6E83B8" font-family="PingFang SC,sans-serif" font-size="10.5">有工具调用</text><text x="1544" y="602.0" fill="#6E83B8" font-family="PingFang SC,sans-serif" font-size="11">→ 下一 step</text><rect x="40" y="940" width="1600" height="102" rx="10" fill="#0E1420" stroke="#2A3346"/><text x="62" y="968" fill="#EEF3FF" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600">关键点</text><text x="62" y="992" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="12">· 没有「一次性的我」：每一轮回答都是 step⑥ 的一次独立请求，step④ 每步重装一次上下文。</text><text x="62" y="1012" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="12">· 我的「思考」在 ⑥ 内部（远端、不可见）；其余每一步都是本地可读的 TS 代码。</text><text x="62" y="1032" fill="#93A5C4" font-family="PingFang SC,sans-serif" font-size="12">· 会话日志（turn/step/tool/assistant 事件）在每一步落盘，所以重启后能 resume。</text></svg>